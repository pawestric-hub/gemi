<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173D32"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><title>GEMI – Personal Finance</title>
<style>
:root{--g:#173D32;--s:#8FB39A;--c:#F6F0E3;--w:#fff;--gold:#C9A55C;--t:#1d2b25;--m:#6b7a72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--c:#101a16;--w:#1a2a23;--t:#eef3ee;--m:#9db0a5}}
:root[data-theme=dark]{--c:#101a16;--w:#1a2a23;--t:#eef3ee;--m:#9db0a5}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:'Plus Jakarta Sans',Poppins,system-ui,sans-serif;background:var(--c);color:var(--t)}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.wel{min-height:100vh;background:linear-gradient(160deg,#173D32,#2c6050 60%,#8FB39A);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(30px,-40px)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes sc{from{opacity:0;transform:scale(.6)}}
.logo{width:92px;height:92px;border-radius:26px;background:var(--c);color:var(--g);font:700 44px Poppins,sans-serif;display:grid;place-items:center;border:3px solid var(--gold);animation:sc 1s both}
.wel>*{z-index:1;animation:up .8s both}.wel p{margin:6px 0}.wel .logo{animation:sc 1s both}
.btn{border:0;border-radius:14px;padding:14px 28px;font:600 15px inherit;background:var(--gold);color:#173D32;cursor:pointer;position:relative;overflow:hidden}
.btn.g{background:var(--g);color:#fff}.btn.o{background:transparent;color:var(--m)}.btn:active{transform:scale(.97)}
.by{position:absolute;right:14px;bottom:10px;font-size:11px;color:#cfe3d6;opacity:.8}
.tut{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px}
.ill{font-size:84px;animation:sc .6s both}.dots span{display:inline-block;width:9px;height:9px;border-radius:9px;background:#ccc;margin:3px}.dots .on{background:var(--g);width:24px}
.top{background:var(--g);color:#fff;padding:22px 18px 30px;border-radius:0 0 28px 28px}
.top small{opacity:.75}.top h1{font-size:30px;margin:4px 0}
main{padding:14px 14px 90px}.card{background:var(--w);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini small{color:var(--m)}.mini b{display:block;font-size:15px}.in{color:#1f8a4c}.out{color:#c0392b}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 13px sans-serif;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:var(--w);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
nav button{flex:1;border:0;background:none;color:var(--m);font:500 11px inherit;padding:4px}nav .on{color:var(--g);font-weight:700}nav i{display:block;font-size:20px;font-style:normal}
.bar{height:9px;background:#e4e4e4;border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--s);transition:width .8s}
.chart{display:flex;gap:8px;align-items:flex-end;height:90px}.chart div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.chart i{flex:1;border-radius:4px 4px 0 0;min-height:2px;transition:height .8s}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}.md>div{background:var(--w);width:100%;max-width:480px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 3px}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #cfd8d2;font:inherit;background:var(--c);color:var(--t)}
h3{margin:4px 0 10px}button,input,select,textarea{font-family:inherit}.btn{font-size:15px;font-weight:600}h1,h2,h3,.logo{font-family:'Playfair Display',Georgia,serif}.top h1{font-size:32px}.acts{display:flex;gap:8px;margin-bottom:12px}.acts .btn{flex:1;padding:12px 4px;font-size:13px}
.wal{position:relative;height:120px;width:170px;margin:6px auto;font-size:56px;line-height:1}.wal b{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:2;font-weight:400;animation:bob 2s ease-in-out infinite}.wal i{position:absolute;bottom:34px;left:50%;font-style:normal;font-size:26px;opacity:0;animation:fly 3.2s ease-out infinite}@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),-105px) rotate(var(--r)) scale(1.1)}}@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
body{background:#F7F3E8}.hd{display:flex;gap:12px;align-items:center;padding:16px 16px 4px}.bk{width:38px;height:38px;border-radius:50%;border:0;background:var(--w);font-size:24px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--g);cursor:pointer}
.tc{margin:10px 14px 0;background:linear-gradient(135deg,#173D32,#2f6a56);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 18px rgba(23,61,50,.3)}.tc h1{margin:4px 0;font-size:34px}
.tl{border-radius:18px;padding:14px 8px;text-align:center;color:#1d2b25;font-size:22px}.tl small{display:block;font-size:12px;color:#444}.tl b{display:block;font-size:15px;margin-top:2px}
.rk{display:flex;gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.rc{flex:none;min-width:92px;text-align:center;background:var(--c);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}.rc small{font-size:12px}.rc b{font-size:11px}
nav .fab{flex:none;width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;font-size:32px;margin:-24px 6px 0;border:4px solid #F7F3E8;box-shadow:0 4px 12px rgba(23,61,50,.4)}
main{padding-top:12px}
